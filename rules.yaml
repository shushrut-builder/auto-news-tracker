settings:
  fetch:
    timeout_seconds: 8
    retries: 2
    workers: 10
  lookback_hours: 24
  max_lookback_hours: 72
  title_similarity: 0.75
  sent_memory_days: 14
  confidence_gate: 0.7
  priority:
    min_signals: 2
    window_days: 30
  caps:
    new_business: 5
    industry_development: 3
    lower_priority: 3
  retry_hours: 3
  ai:
    model: claude-haiku-5-5
    batch_size: 20
    max_tokens: 8000
    effort: low
