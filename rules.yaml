# Daily Automotive Sales Signals: sources, keywords and thresholds.
# Maintainers only. config.yaml holds the team settings (recipients, time, watchlist).
#
# sources: tier 1 = official/press releases, 2 = trade press, 3 = general news/aggregators.
#          auto_only: true skips the "must look automotive" keyword check (the feed is all automotive).
# prefilter.exclude / exclude_url: dropped as noise. prefilter.include: needed for auto_only: false sources.
# signals: keyword rules used when AI is off or fails; first match wins, so order matters.
us:
  name: Tekion
  aliases:
  - Tekion Corp
  - Tekion ARC
  # Used in "Why it matters" only when a story points straight at one of these. Edit to match current offerings.
  products:
  - 'Automotive Retail Cloud (ARC): one cloud platform for dealers covering DMS, CRM, digital retail, service and accounting'
  - 'Automotive Enterprise Cloud (AEC): for carmakers and distributors running their retail network'
  - 'Automotive Partner Cloud (APC): integrations with third-party dealer tools'
competitors:   # dealer software providers that compete with us (DMS, CRM, service)
- name: CDK Global
  aliases:
  - CDK
  - Elead
- name: Reynolds and Reynolds
  aliases:
