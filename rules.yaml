prefilter:
  exclude:
  - '\breview\b'
  - test drive
  - '\bfirst drive\b'
  - 'motorsport|formula 1|\bf1\b|nascar|grand prix|\bindycar\b|rally\b'
  - '\bbest\b.{0,40}\b(of|for|to buy)\b'
  - '\b(lease|financing) deals?\b|\bprice cut\b|\bdeals? (of|on) the\b|\bdiscounts?\b'
  - 'celebrity|kardashian|spotted driving'
  - '\bhoroscope\b|\bcricket\b|\bfootball\b'
  - 'roundup|round-up|newscast|week in review|news wrap|daily brief|morning brief|\bpodcast\b|\bwebinar\b'
  - '^(watch|video|photos?|gallery)\b'
  - 'information collection activities|sunshine act|performance review board|privacy act of 1974|meeting notice|\| daily dealer live|\blive:'
  - '\bspied\b|\bspotted\b|spy shots?|leaked images|\bteased\b|\bteaser\b|\bviral\b|tiktok|youtuber|repair bill|\b(man|woman|owner|driver) (buys|bought|finds|discovers|sues|spends)\b'
  include:
  - 'dealer|dealership|dealer group|auto group|automotive group|showroom|rooftop'
  - 'automaker|carmaker|\boem\b|auto ?maker|automotive|auto industry|auto sector|car market|vehicle market'
  - '\bdms\b|dealer management|dealer software|automotive retail'
  - '\b(vehicle|car|auto|suv|truck)s? recalls?|recalls? .{0,40}\b(vehicles|cars|suvs|trucks|pickups)\b'
  - '\bev\b|\bevs\b|electric vehicle|electric suv|electric car|hybrid vehicle'
  - '(car|vehicle|auto|passenger vehicle|two-wheeler|motorcycle) (sales|registrations|deliveries|exports)'
  - '\bnhtsa\b|motor vehicle|fmvss|\bsmmt\b|\bfada\b|\bsiam\b'
  - 'CDK|Reynolds|Dealertrack|Tekion|Cox Automotive'
  - '\b(Toyota|Lexus|Honda|Nissan|Mazda|Subaru|Suzuki|Mitsubishi Motors|Isuzu|Hyundai|Kia|Genesis Motor|Ford|General Motors|GM|Chevrolet|Stellantis|Jeep|Tesla|Rivian|BMW|Mercedes|Volkswagen|Audi|Porsche|Volvo
    Cars|Renault|Jaguar Land Rover|JLR|Tata Motors|Mahindra|Maruti|Ashok Leyland|Hero MotoCorp|Bajaj Auto|TVS Motor|BYD|Geely|Chery|MG Motor|Al-Futtaim|Abdul Latif Jameel|Al Tayer|Juffali)\b'
  exclude_url:
  - 'newscast|roundup|round-up|week-in-review|podcast|webinar|/video/|/videos/'
signals:
  oem_dms_certification:
    patterns:
    - '(certif|approv|endorse)\w*.{0,60}\b(dms|dealer management)'
    - '\b(dms|dealer management).{0,60}(certif|approv|endorse)'
    implication: 'OEM certification determines which dealer management systems that brand''s dealers can adopt.'
  competitor_incident:
    patterns:
    - '(CDK|Reynolds|Dealertrack).{0,80}(outage|cyber|hack|breach|ransomware|lawsuit|antitrust|settle)'
    - '(outage|cyberattack|breach|ransomware).{0,80}(CDK|Reynolds|Dealertrack)'
    implication: Incidents at a competing provider often prompt affected dealers to review their software vendor.
  competitor_selected:
    patterns:
    - '(selects?|chooses?|signs?|partners? with|deploys?|rolls? out|implements?|migrates? to|switch\w* to).{0,60}(CDK|Reynolds|Dealertrack)'
    implication: A multi-year commitment to a competing platform reduces near-term switching opportunity.
  acquisition:
    patterns:
    - '\b(acquir\w*|buys|bought|purchase[sd]?|takes over|completes purchase of)\b.{0,60}\b(dealerships?|dealer|stores?|group|rooftops?|stake|company|business|franchises?|automotive|motors|auto|cadillac|toyota|honda|ford|chevrolet|nissan|hyundai|kia|bmw|mercedes|lexus|jeep|subaru|mazda|volkswagen|audi|porsche)\b'
    - '\bmerger\b|\bmerges? with\b|takeover|to be acquired|acquired by|sells? .{0,40}(dealership|stores|group)'
    implication: Ownership changes typically lead to a review of the systems used across the combined stores.
  closure:
    patterns:
    - '\bclos(e|es|ed|ing|ure)\b.{0,60}(dealership|store|showroom|plant)'
    - '(dealership|store|showroom).{0,60}\bclos(e|es|ed|ing|ure)\b'
    - '(los(es|t)|terminat\w+|drop\w*).{0,40}franchise'
    - '\bbankrupt|\binsolven'
    implication: Closures and lost franchises reduce the number of stores relying on existing systems.
  new_store:
    patterns:
    - '\bopens?\b.{0,60}(dealership|store|showroom|location|rooftop)'
    - '(new|opening).{0,20}(dealership|showroom|store)\b'
    - 'groundbreaking|breaks ground'
    implication: 'New stores need systems configured from day one, which often prompts a technology decision.'
  market_entry:
    patterns:
    - '(enters?|entry into|enter the|launch\w* in|debut\w* in).{0,60}(market|india|us\b|u\.s\.|uk\b|europe|middle east|uae|saudi|japan|korea)'
    - '(appoints?|names?|signs?).{0,60}(distributor|importer)'
    - 'distribution (agreement|partner)'
    implication: Market entries create new dealer networks that need retail systems in place.
  leadership_change:
    patterns:
    - '(appoints?|names?|hires?|promotes?|taps?)\b.{0,80}\b(ceo|cio|cto|cfo|coo|president|chief|head of|vice president|vp|director)\b'
    - '\b(ceo|cio|cto|cfo|president)\b.{0,40}(steps down|resigns|retires|departs|to step down)'
    implication: Incoming executives frequently review existing vendor relationships.
  tech_investment:
    patterns:
    - '(invests?|investment|funding|raises?|partners? with|digital retail|digitali[sz]|modernis|moderniz|\bai\b|software|platform).{0,60}(dealer|retail|store|showroom)'
    - '(dealer|retail).{0,40}(technology|software|platform|digital)'
    implication: Technology investment signals openness to evaluating new retail and operations software.
  major_recall:
    patterns:
    - '\brecall'
    implication: Large recalls bring service volume into dealer workshops and test service operations.
  sales_shift:
    patterns:
    - '(sales|registrations|deliveries|market share).{0,40}(rise|rose|jump|surge|grow|up\b|climb|record|fall|fell|drop|decline|slump|down\b|plunge)'
    - '(rise|rose|jump|surge|grow|fall|fell|drop|decline|slump|plunge).{0,40}(sales|registrations|deliveries)'
    rising: 'rise|rose|jump|surge|grow|grew|up\b|climb|record|gain'
    implication: Shifts in brand volume change dealer throughput and the operational load on their systems.
  oem_retail_strategy:
    patterns:
    - 'agency (model|sales)'
    - 'direct.to.consumer|direct sales|online sales|digital retail|omnichannel'
    - '(dealer network|retail network|retail strategy|dealer strategy|dealer standards)'
    implication: 'Changes to an OEM''s retail model reshape how its dealers sell and which systems they need.'
  launch:
    patterns:
    - '\blaunch(es|ed)?\b'
    - '\bunveil'
    - '\bdebut'
    - '\bintroduc\w+ .{0,30}(model|suv|ev|sedan|truck)'
    - 'all-new|new (model|ev|suv)'
    implication: 'New models bring new inventory, pricing and service processes to the brand''s dealers.'
  regulation:
    patterns:
    - 'regulat|\bpolicy\b|\b(new|state|federal|proposed) (law|bill)s?\b|\b(new|final|proposed|federal|ftc|cars|safeguards) rules?\b|\bftc\b|\bmandate\b|tariff|import duty|\bcompliance\b|emission standard'
    implication: Regulatory changes alter dealer compliance obligations and the systems that support them.
# Names that contain a car brand but are a different business. Removed before brand matching,
# so "HD Hyundai" (shipbuilding) or "Hyundai Home Shopping" don't count as Hyundai.
brand_exclude:
- 'HD Hyundai|Hyundai (Heavy|Home Shopping|Department Store|Engineering|E&C|Steel|Construction|Marine|Card|Capital|Elevator|Glovis|Rotem|Bioscience|Oilbank|Livart)'
- 'Honda (Aircraft|Jet|Power Equipment|Marine)'
- 'Toyota (Tsusho|Industries|Boshoku)|Ford Foundation|Kia Tigers|Genesis (BBQ|Energy|Healthcare)|Mini (bar|mum|market)s?\b|Tata (Steel|Consultancy|Power|Sons|Consumer|Chemicals)|TCS\b|Mahindra (Logistics|Finance|Lifespace|Holidays)'
