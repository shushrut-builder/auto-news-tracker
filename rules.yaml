settings:
  fetch:
    timeout_seconds: 8
    retries: 2
    workers: 10
  lookback_hours: 24
  max_lookback_hours: 72
  title_similarity: 0.75
  sent_memory_days: 14
  # Order of items within each section: strongest sales signal first. Edit to re-rank.
  # Order of items within each section, strongest buying trigger first. Edit to re-rank.
  signal_order:
  - acquisition            # new owner: systems get consolidated (risk for an account, opening for a prospect)
  - competitor_selected    # an account leaving, or a prospect's rollout to watch
  - new_store              # a new rooftop needs systems set up now
  - market_entry
  - leadership_change      # new leaders review vendors within months
  - tech_investment        # budget and intent to change tools
  - oem_dms_certification  # decides which systems a brand's dealers may use
  - oem_retail_strategy
  - closure
  - competitor_incident
  - vendor_news
  - regulation
  - market_trend
  - sales_shift
  - launch
  - major_recall
  # 0-1. Below this the story reads as general knowledge, an explainer or opinion rather than hot news.
  hot_news_gate: 0.6
  max_per_outlet: 2             # at most this many items from one publication per email
  caps:
    industry_trends: 3
    account_news: 8
    competitors: 5
    tekion: 3
  retry_hours: 3
  ai:
    model: claude-haiku-5-5
    batch_size: 20
    max_tokens: 8000
    effort: low
