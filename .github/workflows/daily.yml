name: Daily sales signals

on:
  schedule:
    # Every hour at :30 (UTC), which is on the hour in India (UTC+5:30), so the 8 AM IST run starts at 02:30 UTC.
    # The script sends only when it's send_hour in config.yaml's timezone, once per day.
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = build the email and attach it to the run, send nothing; send-now = email the recipients now"
        type: choice
        options: [preview, send-now]
        default: preview
      to:
        description: "Optional: with send-now, send a test copy only to this address"
        required: false

permissions:
  contents: write # to commit sent.json (what was already emailed)

concurrency:
  group: daily-sales-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          MODE: ${{ github.event.inputs.mode }}
          TO: ${{ github.event.inputs.to }}
        run: |
          # Empty secrets would override the script's defaults.
          [ -z "$SMTP_HOST" ] && unset SMTP_HOST
          [ -z "$SMTP_PORT" ] && unset SMTP_PORT
          [ -z "$MAIL_FROM" ] && unset MAIL_FROM
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          [ -z "$EXA_API_KEY" ] && unset EXA_API_KEY
          if [ "$MODE" = "preview" ]; then
            python signals.py --preview
          elif [ "$MODE" = "send-now" ]; then
            if [ -n "$TO" ]; then python signals.py --send-now --to "$TO"; else python signals.py --send-now; fi
          else
            python signals.py
          fi

      - name: Attach the preview
        if: github.event.inputs.mode == 'preview'
        uses: actions/upload-artifact@v4
        with:
          name: email-preview
          path: out/

      - name: Save what was sent
        if: always()
        run: |
          if [ -n "$(git status --porcelain sent.json)" ]; then
            git config user.name "sales-signals-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sent.json
            git commit -m "Update sent log"
            git push
          fi
